<!--
  PLACEHOLDER-GRAFIK: Kann durch ein echtes Foto der Berliner Skyline ersetzt
  werden (berlin-skyline.webp, ca. 800 × 1200 px, Hochformat).
  Motiv: Fernsehturm, Bäume und Wohngebäude.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-labelledby="skylineTitle">
  <title id="skylineTitle">Illustration: Berliner Fernsehturm mit Bäumen und Wohnhäusern</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEEFB"/>
      <stop offset="1" stop-color="#F4FAFF"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#sky)"/>

  <!-- Sonne & Wolken -->
  <circle cx="320" cy="90" r="34" fill="#FCE9A8"/>
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="90" cy="110" rx="46" ry="16"/>
    <ellipse cx="150" cy="150" rx="34" ry="12"/>
    <ellipse cx="290" cy="180" rx="40" ry="14"/>
  </g>

  <!-- Fernsehturm -->
  <g>
    <line x1="150" y1="70" x2="150" y2="240" stroke="#5C708A" stroke-width="4"/>
    <circle cx="150" cy="260" r="26" fill="#8FA6BE"/>
    <circle cx="150" cy="260" r="26" fill="#FFFFFF" opacity="0.25"/>
    <path d="M138 286 L150 470 L162 286 Z" fill="#7A90AB"/>
    <path d="M120 470 L150 420 L180 470 Z" fill="#7A90AB"/>
  </g>

  <!-- Wohnhäuser -->
  <g>
    <rect x="-20" y="400" width="120" height="200" fill="#B7CCE0"/>
    <rect x="10" y="370" width="130" height="230" fill="#A3BDD6"/>
    <g fill="#EAF3FB">
      <rect x="24" y="392" width="18" height="22"/><rect x="56" y="392" width="18" height="22"/><rect x="88" y="392" width="18" height="22"/>
      <rect x="24" y="430" width="18" height="22"/><rect x="56" y="430" width="18" height="22"/><rect x="88" y="430" width="18" height="22"/>
      <rect x="24" y="468" width="18" height="22"/><rect x="56" y="468" width="18" height="22"/><rect x="88" y="468" width="18" height="22"/>
      <rect x="24" y="506" width="18" height="22"/><rect x="56" y="506" width="18" height="22"/><rect x="88" y="506" width="18" height="22"/>
    </g>
    <rect x="200" y="420" width="110" height="180" fill="#C3D6E8"/>
    <rect x="216" y="398" width="150" height="202" fill="#ACC4DA"/>
    <g fill="#EAF3FB">
      <rect x="230" y="418" width="20" height="24"/><rect x="266" y="418" width="20" height="24"/><rect x="302" y="418" width="20" height="24"/>
      <rect x="230" y="458" width="20" height="24"/><rect x="266" y="458" width="20" height="24"/><rect x="302" y="458" width="20" height="24"/>
      <rect x="230" y="498" width="20" height="24"/><rect x="266" y="498" width="20" height="24"/><rect x="302" y="498" width="20" height="24"/>
      <rect x="230" y="538" width="20" height="24"/><rect x="266" y="538" width="20" height="24"/><rect x="302" y="538" width="20" height="24"/>
    </g>
  </g>

  <!-- Bäume -->
  <g>
    <rect x="120" y="540" width="10" height="60" fill="#7A5230"/>
    <circle cx="125" cy="520" r="34" fill="#3E9E5C"/>
    <circle cx="104" cy="538" r="22" fill="#4CB56C"/>
    <rect x="356" y="530" width="10" height="70" fill="#7A5230"/>
    <circle cx="361" cy="508" r="36" fill="#3E9E5C"/>
    <circle cx="384" cy="528" r="24" fill="#4CB56C"/>
    <rect x="188" y="556" width="8" height="44" fill="#7A5230"/>
    <circle cx="192" cy="540" r="24" fill="#46A764"/>
  </g>

  <!-- Straße -->
  <rect y="588" width="400" height="12" fill="#9DB2C6"/>
</svg>